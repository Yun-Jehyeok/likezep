<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>멘토링 플랫폼</title>
        <!-- Pretendard는 자체 호스팅한다 (src/fonts/pretendard.css를 main.tsx가 렌더를 막지 않게 <link>로 붙인다) -->
        <script>
            // 강의 목록 API·첫 화면 썸네일 선행 요청 — HTML 단계 (강의실 성능 §5.1 ①·③, docs/plans/learn-performance.md)
            // shell 첫 렌더(감속 cold 약 2.7s, warm 약 1.4s)를 기다리지 않고 HTML을 받자마자 /api/courses를 보낸다.
            // - /learn: 강의실 첫 진입·재방문 (①)
            // - /lobby: 로비에서 강의실로 갈 때 클릭 뒤 API·썸네일 왕복을 없앤다 (③). 25초 안에 누르면 이 응답을 쓴다.
            //   데이터 절약 모드(Save-Data)면 로비에서는 하지 않는다
            // - 계약은 apps/shell/src/app/prefetch.ts와 같다: window.__likezepPrefetch["/api/courses"] = { at, promise, failed? }
            //   learn(apps/learn/src/prefetch.ts)이 꺼내 쓰고, shell prefetchApi는 25초 안 같은 경로면 다시 요청하지 않는다
            // - 요청 모양(헤더·실패 처리)은 @mentoring/ui createApiClient와, 썸네일 장수 어림은 prefetch.ts preloadListThumbnails와 맞춘다
            //   (둘 중 하나를 바꾸면 여기도 고칠 것)
            // - API 주소는 빌드 때 Vite가 HTML의 env 자리표시자를 VITE_API_URL 값으로 바꾼다. 못 바꿨으면 건너뛴다
            // - 실패해도 learn이 직접 요청하므로 동작은 같다
            (function () {
                try {
                    var token = localStorage.getItem("auth_token");
                    if (!token) return;
                    var onLobby = /^\/lobby\/?$/.test(location.pathname);
                    if (!onLobby && !/^\/learn\/?$/.test(location.pathname)) return;
                    if (onLobby && navigator.connection && navigator.connection.saveData) return;
                    var api = "%VITE_API_URL%";
                    if (!/^https?:\/\//.test(api)) return;
                    try {
                        // 만료된 토큰이면 요청하지 않는다 (App.tsx가 로그아웃시킨다)
                        var exp = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp;
                        if (exp && Date.now() / 1000 >= exp) return;
                    } catch (e) {
                        /* 해석 못 하면 그냥 요청 (만료면 401 → learn이 직접 요청) */
                    }
                    var path = "/api/courses";
                    var promise = fetch(api + path, {
                        method: "GET",
                        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
                    }).then(function (r) {
                        if (!r.ok) throw new Error("prefetch " + r.status);
                        return r.json();
                    });
                    var entry = { at: Date.now(), promise: promise };
                    promise.catch(function () {
                        entry.failed = true; // unhandled rejection 방지 + shell prefetchApi가 중복 방지에서 빼고 다시 요청
                    });
                    (window.__likezepPrefetch = window.__likezepPrefetch || {})[path] = entry;
                    promise.then(function (list) {
                        if (!Array.isArray(list)) return;
                        // 첫 화면 카드 수 어림: learn CourseListPage grid-cols-1 / sm:2 / lg:3, 첫 줄 240px, 줄 간격 311px
                        var w = window.innerWidth;
                        var n = (w >= 1024 ? 3 : w >= 640 ? 2 : 1) * Math.max(1, Math.ceil((window.innerHeight - 240) / 311));
                        var seen = {};
                        var keep = []; // GC로 요청이 끊기지 않게 잠시 붙잡아 둔다
                        list.slice(0, n).forEach(function (c) {
                            var u = c && c.thumbnail;
                            if (typeof u !== "string" || !u || seen[u]) return;
                            seen[u] = 1;
                            var img = new Image(); // learn <img>와 같은 CORS 모드(속성 없음) → 같은 문서에서 재사용
                            img.setAttribute("fetchpriority", "high");
                            img.decoding = "async";
                            img.src = u;
                            keep.push(img);
                        });
                        setTimeout(function () {
                            keep.length = 0;
                        }, 30000);
                    }, function () {});
                } catch (e) {
                    /* 선행 요청은 없어도 된다 */
                }
            })();
        </script>
        <script>
            // MF 체인 미리 받기 — remote 쪽 (강의실 성능 P3 ③, docs/plans/learn-performance.md)
            // cold 진입은 MF 파일을 "앞 파일을 실행해야 다음 주소를 아는" 순서로 받아 단계마다 왕복이 쌓인다.
            // 로그인 상태로 /learn 또는 /lobby에 들어오면 각 remote의 mf-manifest.json을 받아 그 파일들을 한꺼번에 미리 받는다.
            // - /lobby (§5.1 ②): 로비 진입 직후 강의실을 눌러도 learn 청크가 이미 받아져 있게 HTML 단계에서 받는다.
            //   learn 청크는 원래도 로비가 한가할 때 받았다(LobbyPage schedulePreloadLearn) — 바뀌는 건 받는 시점.
            //   host 초기화(room·learn 런타임)도 /learn처럼 병렬이 된다. 데이터 절약 모드(Save-Data)면 로비에서는 하지 않는다
            // - learn: expose App의 sync JS + async 중 공유 모듈 연결 청크(__loadShare__) + CSS
            //   (async의 나머지는 react 등 공유 모듈의 대체본이라 shell이 공유하면 쓰이지 않는다. modulepreload는 import한 파일을
            //   따라 받지 않으므로 필요한 파일을 목록으로 지정해야 한다 — Chrome 확인 2026-11-16)
            // - room: 초기화 파일(공유 모듈 맵까지)만 — host 초기화가 room 초기화까지 기다리기 때문
            // - <head> 맨 앞에 둔다: 렌더 차단 CSS보다 앞이라 CSS를 기다리지 않고 바로 실행된다
            // - 미리 받은 파일은 MF 런타임이 같은 주소로 import할 때 그대로 쓰인다. 실패하면 미리 받기만 빠진다
            // - __MF_LEARN_LOADER__는 빌드 때 shell의 learn loadRemote 청크 경로로 바뀐다 (vite.config.ts mfChainPreload)
            (function () {
                try {
                    if (!localStorage.getItem("auth_token")) return;
                    var onLearn = /^\/learn(\/|$)/.test(location.pathname);
                    var onLobby = /^\/lobby\/?$/.test(location.pathname);
                    if (!onLearn && !onLobby) return;
                    if (onLobby && navigator.connection && navigator.connection.saveData) return;
                    var head = document.head;
                    var add = function (rel, href, as) {
                        var l = document.createElement("link");
                        l.rel = rel;
                        l.href = href;
                        if (as) l.as = as;
                        if (rel === "modulepreload") l.crossOrigin = "anonymous";
                        head.appendChild(l);
                    };
                    var loader = "__MF_LEARN_LOADER__";
                    if (loader.charAt(0) === "/") add("modulepreload", loader);
                    var preload = function (app, pick) {
                        var base = location.origin + "/remotes/" + app + "/";
                        fetch(base + "mf-manifest.json")
                            .then(function (r) {
                                return r.ok ? r.json() : null;
                            })
                            .then(function (m) {
                                var e = m && m.exposes && m.exposes.filter(function (x) { return x.name === "App"; })[0];
                                if (!e || !e.assets) return;
                                var a = pick(e.assets);
                                a.js.forEach(function (p) { add("modulepreload", base + p); });
                                a.css.forEach(function (p) { add("preload", base + p, "style"); });
                            })
                            .catch(function () {});
                    };
                    preload("learn", function (a) {
                        var shareGlue = a.js.async.filter(function (p) { return p.indexOf("__loadShare__") >= 0; });
                        return { js: a.js.sync.concat(shareGlue), css: a.css.sync };
                    });
                    preload("room", function (a) {
                        var s = a.js.sync;
                        for (var i = 0; i < s.length; i++) if (s[i].indexOf("localSharedImportMap") >= 0) return { js: s.slice(0, i + 1), css: [] };
                        return { js: [], css: [] };
                    });
                } catch (e) {
                    /* 미리 받기는 없어도 된다 */
                }
            })();
        </script>
    </head>

        <!--

        <script>
            // 정적 스켈레톤: 로그인 상태에서 /learn, /learn/:id, /lobby로 들어오면 JS 번들보다 먼저 뼈대를 그린다.
            // React가 첫 렌더 때 #root 내용을 갈아끼운다. 그 외 경로는 지금처럼 비워 둔다.
            (function () {
                try {
                    if (!localStorage.getItem("auth_token")) return;
                    var p = location.pathname.replace(/\/+$/, "");
                    var id = p === "/learn" ? "sk-learn" : /^\/learn\/[^/]+$/.test(p) ? "sk-course" : p === "/lobby" ? "sk-lobby" : null;
                    var t = id && document.getElementById(id);
                    if (t) document.getElementById("root").innerHTML = t.innerHTML;
                } catch (e) {
                    /* 스켈레톤은 없어도 된다 */
                }
            })();
        </script>
