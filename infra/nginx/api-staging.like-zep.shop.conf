# Staging API 서버 nginx 설정 (t4g.nano 검증 스택용).
#
# 배포 위치: EC2:/etc/nginx/sites-available/api-staging.like-zep.shop
# api.like-zep.shop.conf와 도메인/인증서 경로만 다르다. 컷오버(Phase C) 후에는
# 이 스테이징 인스턴스가 새 프로덕션이 되므로 server_name을 api.like-zep.shop로
# 교체하고 인증서를 재발급하면 됨.
#
# 관련: docs/plans/s3-cloudfront-migration.md §Phase B

server {
    listen 443 ssl http2;
    server_name api-staging.like-zep.shop;

    ssl_certificate     /etc/letsencrypt/live/api-staging.like-zep.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.like-zep.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:2567;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name api-staging.like-zep.shop;
    return 301 https://$host$request_uri;
}
