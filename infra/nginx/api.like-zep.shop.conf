# Production API 서버 nginx 설정 (S3+CloudFront 이관 후 사용).
#
# 배포 위치: EC2:/etc/nginx/sites-available/api.like-zep.shop
# 활성화: ln -s /etc/nginx/sites-available/api.like-zep.shop /etc/nginx/sites-enabled/
# 검증: sudo nginx -t
# 적용: sudo systemctl reload nginx
#
# 이관 전 nginx는 map $http_upgrade 분기로 HTTP는 :3000(pm2 client), WS는 :2567로 라우팅했으나,
# 클라 정적 자산이 S3+CloudFront로 이관되면서 EC2 nginx는 API/WS/mediasoup 시그널링만 담당.
# 따라서 map 분기, / → :3000 라우팅, /matchmake·/api·/ms 개별 location 모두 제거하고
# 단일 location /으로 통합 프록시.
#
# 관련: docs/plans/s3-cloudfront-migration.md §3

# HTTPS: 모든 요청을 :2567(Colyseus + Express + mediasoup)로 프록시.
server {
    listen 443 ssl http2;
    server_name api.like-zep.shop;

    # Let's Encrypt 인증서 (certbot으로 발급 후 이 경로에 배치됨).
    ssl_certificate     /etc/letsencrypt/live/api.like-zep.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.like-zep.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 채팅 히스토리 등 REST payload 여유 (기본 1MB → 10MB).
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:2567;

        # WebSocket upgrade — Colyseus WS + mediasoup transport ICE 모두 이 경로로 흐른다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 실제 클라이언트 정보 전달.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket idle timeout — Colyseus는 heartbeat이 있지만 여유 있게.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # 프록시 버퍼 비활성 — Colyseus 메시지가 즉시 전달되도록.
        proxy_buffering off;
    }
}

# HTTP → HTTPS 강제 리다이렉트.
server {
    listen 80;
    server_name api.like-zep.shop;
    return 301 https://$host$request_uri;
}
