# API 응답 압축 (강의실 성능 P4b, docs/plans/learn-performance.md)
#
# 배치: EC2 /etc/nginx/conf.d/likezep-gzip.conf  (nginx.conf의 http 블록이 conf.d/*.conf를 include)
# 적용: sudo nginx -t && sudo systemctl reload nginx   — reload는 기존 연결(WebSocket 포함)을 끊지 않는다
# 되돌리기: 파일 삭제 후 같은 명령
#
# Ubuntu 기본 nginx.conf는 `gzip on`만 켜져 있고 gzip_types가 주석이라 text/html만 압축한다.
# 그래서 /api/courses(약 41KB, 93%가 썸네일 presigned URL) 같은 JSON이 무압축으로 나갔다.
# nginx.conf에서 아래 지시어들은 모두 주석 상태라 여기서 처음 설정한다(중복 지시어 오류 없음).

gzip_types application/json;
# API는 CloudFront를 거치지 않고 브라우저가 직접 부르지만, 프록시를 거친 요청(Via 헤더)도 압축한다
gzip_proxied any;
# 작은 응답(헬스 체크 등)은 압축 이득보다 비용이 커서 제외
gzip_min_length 1024;
gzip_vary on;
# t4g.nano CPU를 고려해 중간 수준
gzip_comp_level 5;
